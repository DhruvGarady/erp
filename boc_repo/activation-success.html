<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Activated - CoreFlow ERP</title>
  <link rel="shortcut icon" href="global/css/images/coreFlow/images.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(8, 20, 44, 0.998), rgba(14, 44, 101, 0.985) 48%, rgba(32, 114, 243, 0.955)),
        url("global/css/images/coreFlow/all images.png");
      background-size: cover;
      background-position: center;
      color: #07152f;
      font-family: "Inter", Arial, sans-serif;
    }

    .activation-card {
      width: 100%;
      max-width: 460px;
      padding: 42px;
      border: 1px solid #d8e2f1;
      border-radius: 24px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      box-shadow: 0 28px 80px rgba(13, 27, 54, 0.18);
      text-align: center;
    }

    .activation-logo {
      width: 230px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .activation-icon {
      width: 58px;
      height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      border-radius: 50%;
      background: #e9fff3;
      color: #18a957;
      font-size: 24px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 800;
    }

    p {
      margin: 12px 0 26px;
      color: #63708a;
      font-size: 15px;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 12px;
      background: #2072f3;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(32, 114, 243, 0.22);
    }
  </style>
</head>

<body>
  <main class="activation-card">
    <img class="activation-logo" src="global/css/images/coreFlow/logo2.png" alt="CoreFlow ERP">
    <div class="activation-icon">
      <i class="fa-solid fa-check"></i>
    </div>
    <h1>Account activated</h1>
    <p>Your email has been verified. You can now sign in to CoreFlow ERP.</p>
    <a href="index.html">
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
      Go to Login
    </a>
  </main>
</body>

</html>
