<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoreFlow ERP Login</title>
  <link rel="shortcut icon" href="global/css/images/coreFlow/images.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="global/css/style_et_1.css">
  <link rel="stylesheet" href="global/libs/jquery/jquery-ui.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="global/global_exp1.js" type="text/javascript"></script>
  <script src="global/properties.js" type="text/javascript"></script>
  <script src="scripts/index.js"></script>

<style>
  :root {
    --core-blue: #2072f3;
    --core-blue-dark: #0a1b3b;
    --core-ink: #111827;
    --core-muted: #63708a;
    --core-line: #d8e2f1;
    --core-surface: #ffffff;
    --core-page: #eef4fb;
  }

  * {
    box-sizing: border-box;
  }

  body.coreflow-login-body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", Arial, sans-serif;
    color: var(--core-ink);
    background:
      linear-gradient(135deg, rgba(8, 20, 44, 0.998), rgba(14, 44, 101, 0.985) 48%, rgba(32, 114, 243, 0.955)),
      url("global/css/images/coreFlow/all images.png");
    background-size: cover;
    background-position: center;
  }

  .coreflow-login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px;
  }

  .coreflow-login-shell {
    width: 100%;
    max-width: 480px;
    min-height: auto;
    display: block;
    overflow: hidden;
    background: var(--core-surface);
    border: 1px solid rgba(143, 160, 188, 0.35);
    border-radius: 24px;
    box-shadow: 0 28px 80px rgba(13, 27, 54, 0.16);
  }

  .coreflow-brand-panel {
    display: none;
  }

  .coreflow-brand-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, rgba(8, 20, 44, 0.998), rgba(14, 44, 101, 0.985) 48%, rgba(32, 114, 243, 0.955)),
      url("global/css/images/coreFlow/all images.png");
    background-size: cover;
    background-position: center;
  }

  .coreflow-brand-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
    pointer-events: none;
  }

  .coreflow-brand-top,
  .coreflow-brand-main,
  .coreflow-logo-card {
    position: relative;
    z-index: 1;
  }

  .coreflow-brand-top {
    display: none;
  }

  .coreflow-mark-card {
    width: 68px;
    height: 68px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.32);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.18);
  }

  .coreflow-mark-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .coreflow-brand-label {
    flex: 1;
  }

  .coreflow-brand-label strong {
    display: block;
    font-size: 18px;
    font-weight: 800;
    line-height: 1.2;
  }

  .coreflow-brand-label span {
    display: block;
    margin-top: 4px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 13px;
    font-weight: 500;
  }

  .coreflow-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.88);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .coreflow-status i {
    color: #62e6a8;
    font-size: 9px;
  }

  .coreflow-brand-main {
    display: none;
  }

  .coreflow-logo-card {
    width: min(78%, 360px);
    padding: 36px 28px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.38);
    box-shadow: 0 22px 58px rgba(0, 0, 0, 0.2);
  }

  .coreflow-logo-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  .coreflow-login-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px;
    background: linear-gradient(180deg, #ffffff, #f8fbff);
  }

  .coreflow-logo {
    display: block;
    width: 230px;
    max-width: 100%;
    height: 90px;
    object-fit: contain;
    object-position: center;
    margin: 0 auto 28px;
  }

  .coreflow-login-title {
    margin: 0;
    color: #07152f;
    font-size: 32px;
    line-height: 1.2;
    font-weight: 800;
    text-align: center;
  }

  .coreflow-login-sub {
    margin: 8px 0 24px;
    color: var(--core-muted);
    font-size: 15px;
    line-height: 1.6;
    text-align: center;
  }

  .coreflow-form {
    width: 100%;
  }

  .coreflow-form-group {
    margin-bottom: 18px;
  }

  .coreflow-form-label {
    display: block;
    margin: 0 0 9px;
    color: #24324d;
    font-size: 13px;
    font-weight: 800;
  }

  .coreflow-input-shell {
    position: relative;
  }

  .coreflow-input-shell i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #7c8ba5;
    font-size: 15px;
    pointer-events: none;
  }

  .coreflow-form-control {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    border: 1px solid var(--core-line);
    border-radius: 12px;
    background: #ffffff;
    color: #10203d;
    font-size: 15px;
    outline: 0;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .coreflow-form-control:focus {
    border-color: var(--core-blue);
    box-shadow: 0 0 0 4px rgba(32, 114, 243, 0.12);
  }

  .coreflow-row-inline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 4px 0 20px;
  }

  .coreflow-remember {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 0;
    color: #52617a;
    font-size: 13px;
    font-weight: 500;
  }

  .coreflow-remember input {
    width: 17px;
    height: 17px;
    padding: 0;
    accent-color: var(--core-blue);
  }

  .coreflow-link {
    color: #1f6eea;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
  }

  .coreflow-link:hover {
    color: #0c50bd;
    text-decoration: underline;
  }

  .coreflow-btn-login {
    width: 100%;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0;
    border-radius: 12px;
    background: #2072f3;
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 26px rgba(32, 114, 243, 0.22);
    transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
  }

  .coreflow-btn-login:hover {
    background: #155fdb;
    box-shadow: 0 15px 30px rgba(32, 114, 243, 0.28);
    transform: translateY(-1px);
  }

  .coreflow-signup {
    margin: 20px 0 0;
    text-align: center;
    color: #5c6a82;
    font-size: 14px;
  }

  .coreflow-foot-note {
    display: none;
  }

  .coreflow-foot-note i {
    color: #1f6eea;
  }

  .coreflow-register-dialog {
    border: 0 !important;
    border-radius: 18px !important;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(8, 20, 44, 0.28) !important;
  }

  .coreflow-register-dialog .ui-dialog-content {
    padding: 0 !important;
  }

  .coreflow-register-dialog .ui-dialog-buttonpane {
    margin: 0 !important;
    padding: 14px 22px 18px !important;
    border-top: 1px solid #e2eaf6 !important;
    background: #f8fbff;
  }

  .coreflow-register-modal {
    background: #ffffff;
  }

  .coreflow-register-head {
    padding: 24px 26px 18px;
    border-bottom: 1px solid #e2eaf6;
    background: linear-gradient(180deg, #ffffff, #f7faff);
    text-align: center;
  }

  .coreflow-register-head img {
    width: 180px;
    height: 62px;
    object-fit: contain;
    margin-bottom: 10px;
  }

  .coreflow-register-head h3 {
    margin: 0;
    color: #07152f;
    font-size: 22px;
    font-weight: 800;
  }

  .coreflow-register-head p {
    margin: 7px 0 0;
    color: #63708a;
    font-size: 13px;
  }

  .coreflow-register-form {
    padding: 22px 26px 8px;
  }

  .coreflow-register-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .coreflow-register-field {
    margin: 0;
  }

  .coreflow-register-field.full {
    grid-column: 1 / -1;
  }

  .coreflow-register-field label {
    display: block;
    margin: 0 0 7px;
    color: #24324d;
    font-size: 12px;
    font-weight: 800;
  }

  .coreflow-register-field input {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    border: 1px solid #d8e2f1;
    border-radius: 10px;
    background: #ffffff;
    color: #10203d;
    font-size: 14px;
    outline: 0;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .coreflow-register-field input:focus {
    border-color: var(--core-blue);
    box-shadow: 0 0 0 4px rgba(32, 114, 243, 0.12);
  }

  .coreflow-required {
    color: #e02f44;
  }

  @media (max-width: 1050px) {
    .coreflow-login-wrap {
      padding: 24px;
    }

    .coreflow-login-shell {
      max-width: 480px;
    }
  }

  @media (max-width: 680px) {
    .coreflow-login-wrap {
      padding: 14px;
      align-items: flex-start;
    }

    .coreflow-login-shell {
      border-radius: 18px;
      min-height: 0;
    }

    .coreflow-login-panel {
      padding: 26px 20px;
    }

    .coreflow-row-inline {
      align-items: flex-start;
      flex-direction: column;
    }

    .coreflow-brand-main h1 {
      font-size: 34px;
    }

    .coreflow-login-title {
      font-size: 28px;
    }

    .coreflow-register-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body class="coreflow-login-body">
  <main class="coreflow-login-wrap">
    <div class="coreflow-login-shell">
      <section class="coreflow-login-panel">
        <img class="coreflow-logo" src="global/css/images/coreFlow/logo2.png" alt="CoreFlow ERP">

        <h2 class="coreflow-login-title">Welcome back</h2>
        <p class="coreflow-login-sub">Enter your credentials to login.</p>

        <form class="coreflow-form" onsubmit="userLogin(); return false;">
          <div class="coreflow-form-group">
            <label class="coreflow-form-label" for="username">Username</label>
            <div class="coreflow-input-shell">
              <i class="fa-regular fa-user"></i>
              <input type="text" id="username" name="username" class="coreflow-form-control" placeholder="Enter your email or username" autocomplete="username" required>
            </div>
          </div>

          <div class="coreflow-form-group">
            <label class="coreflow-form-label" for="password">Password</label>
            <div class="coreflow-input-shell">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" name="password" class="coreflow-form-control" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
          </div>

          <!-- <div class="coreflow-row-inline">
            <label class="coreflow-remember">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="javascript:void(0);" onclick="openRegisterDialog()" class="coreflow-link">Create account</a>
          </div> -->

          <button type="submit" class="coreflow-btn-login">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            Sign In
          </button>
        </form>

        <p class="coreflow-signup">New user? <a href="javascript:void(0);" onclick="openRegisterDialog()" class="coreflow-link">Sign up with email</a></p>
        <p class="coreflow-foot-note">
          <i class="fa-solid fa-circle-check"></i>
          Secure access with JWT authentication and role-aware feature permissions.
        </p>
      </section>
    </div>
  </main>

  <div id="registerDialog" title="Create Account" style="display:none;">
    <div class="coreflow-register-modal">
      <div class="coreflow-register-head">
        <img src="global/css/images/coreFlow/logo2.png" alt="CoreFlow ERP">
        <h3>Create User</h3>
        <p>Add a new user account for CoreFlow ERP access.</p>
      </div>

      <form id="registerForm" class="coreflow-register-form">
        <div class="coreflow-register-grid">
          <div class="coreflow-register-field">
            <label for="first_name">First Name <span class="coreflow-required">*</span></label>
            <input type="text" id="first_name" name="first_name" required>
          </div>

          <div class="coreflow-register-field">
            <label for="last_name">Last Name <span class="coreflow-required">*</span></label>
            <input type="text" id="last_name" name="last_name" required>
          </div>

          <div class="coreflow-register-field full">
            <label for="email">Email <span class="coreflow-required">*</span></label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="coreflow-register-field">
            <label for="reg_username">Username <span class="coreflow-required">*</span></label>
            <input type="text" id="reg_username" name="username" required>
          </div>

          <div class="coreflow-register-field">
            <label for="reg_password">Password <span class="coreflow-required">*</span></label>
            <input type="password" id="reg_password" name="password" required>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
