<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Stock Entry By Warehouse</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="../../global/libs/jquery/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/stock_entry_by_warehouse_add.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }

  .stock-entry-items-wrap {
    height: 45vh;
    overflow: auto;
    border: 1px solid #ddd;
  }

  .stock-entry-items-wrap .dataTbl input,
  .stock-entry-items-wrap .dataTbl select {
    min-width: 110px;
  }

  .stock-entry-items-wrap .dataTbl .lineMaterial {
    min-width: 260px;
  }
</style>

<body>
  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div class="nav-feature-search">
        <span class="material-icons">search</span>
        <input type="text" id="featureSearch" placeholder="Search feature..." autocomplete="off">
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item profile-settings-menu-item" href="javascript:void(0);"><span class="material-icons profile-menu-icon">settings</span><span>Profile Settings</span></a>
            <a class="dropdown-item" href="javascript:void(0);" onclick="functionLogout()"><span class="material-icons profile-menu-icon">logout</span><span>Logout</span></a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;">
        <script type="text/template" id="menuTmpl">
          <%_.each(parentFeatures, function(item, index){ %>
            <table class="menuTable" id="menuTable" style="width:100%; overflow-y:auto;">
              <tr class="menuTr" id="menuTr">
                <td class="menuTd" id="menuTd" width="10%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons"><%= item.icon %></i></td>
                <td class="menuTd" id="menuTd" width="90%" onclick="linkPage('<%= item.feature_url %>')"><%= (item.feature_name) %></td>
                <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                  <td class="menuTd" id="menuTd" width="1%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons">arrow_drop_down</i></td>
                <% }%>
              </tr>

              <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                <%_.each(item.childFeatures, function(oitem, index){ %>
                  <tr class="menuTr" id="menuTr">
                    <td class="submenuTd" id="submenuTd" width="10%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                    <td class="submenuTd" id="submenuTd" width="90%" onclick="linkPage('<%= oitem.feature_url %>')"><%= oitem.feature_name %></td>
                    <td class="submenuTd" id="submenuTd" width="1%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                  </tr>
                <% }); %>
              <% }%>
            </table>
          <% }); %>
        </script>
      </div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="sectionDivHead">
        <table width="99%">
          <tr>
            <td width="85%" class="mainTblHdr" id="pageTitle">Add Stock Entry:</td>
            <td style="text-align:right;">
              <button onclick="backToInquiry()" class="searchButton bg-danger">
                <span class="material-icons">arrow_back</span>
                <span>Back</span>
              </button>
            </td>
            <td width="1%"></td>
            <td style="text-align:right;">
              <button id="saveStockEntryBtn" onclick="saveStockEntry()" class="searchButton bg-primary">
                <span class="material-icons">save</span>
                <span>Save</span>
              </button>
            </td>
          </tr>
        </table>

        <table width="99%">
          <tr>
            <td width="17%">
              <div class="form-group">
                GRN No <span style="color:red;">*</span>
                <input type="text" id="goods_receipt_no" name="goods_receipt_no" disabled>
              </div>
            </td>
            <td width="1%"></td>
            <td width="15%">
              <div class="form-group">
                GRN Date <span style="color:red;">*</span>
                <input type="date" id="goods_receipt_date" name="goods_receipt_date">
              </div>
            </td>
            <td width="1%"></td>
            <td width="20%">
              <div class="form-group">
                Warehouse <span style="color:red;">*</span>
                <select id="warehouse_id" name="warehouse_id"></select>
              </div>
            </td>
            <td width="1%"></td>
            <td width="18%">
              <div class="form-group">
                Vendor
                <select id="vendor_id" name="vendor_id"></select>
              </div>
            </td>
            <td width="1%"></td>
            <td width="12%">
              <div class="form-group">
                Status
                <select id="status" name="status" disabled>
                  <option value="Posted">Posted</option>
                </select>
              </div>
            </td>
          </tr>

          <tr>
            <td>
              <div class="form-group">
                Reference Type
                <select id="reference_type" name="reference_type">
                  <option value="WAREHOUSE_ENTRY">Warehouse Entry</option>
                  <option value="PURCHASE_ORDER">Purchase Order</option>
                  <option value="MANUAL">Manual</option>
                  <option value="OPENING_STOCK">Opening Stock</option>
                </select>
              </div>
            </td>
            <td></td>
            <td>
              <div class="form-group">
                Reference ID
                <input type="number" id="reference_id" name="reference_id">
              </div>
            </td>
            <td></td>
            <td>
              <div class="form-group">
                Reference No
                <input type="text" id="reference_no" name="reference_no">
              </div>
            </td>
            <td></td>
            <td colspan="3">
              <div class="form-group">
                Remarks
                <textarea id="remarks" name="remarks" rows="2"></textarea>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <br>

      <div class="sectionDiv">
        <table width="100%">
          <tr>
            <td class="mainTblHdr"  width="92%">GRN Items:</td>
            <td style="text-align:right;">
              <button id="addStockEntryRowBtn" onclick="addStockEntryItem()" class="searchButton bg-primary"  style="width:100% !important;">
                <span class="material-icons">add</span>
                <span>Add Row</span>
              </button>
            </td>
          </tr>
        </table>

        <div id="stockEntryItemsContainer" class="stock-entry-items-wrap">
          <script type="text/template" id="stockEntryItemsTmpl">
            <table style="width:100%; min-width:1180px;" class="dataTbl">
              <tr>
                <th width="24%">Material</th>
                <th width="9%">Code</th>
                <th width="10%">UOM</th>
                <th width="10%">Received Qty</th>
                <th width="10%">Rate</th>
                <th width="11%">Line Amount</th>
                <th width="20%">Remarks</th>
                <th width="4%" style="text-align:center;">Del</th>
              </tr>

              <%_.each(items, function(item, index){ %>
                <tr data-index="<%= index %>">
                  <td>
                    <select class="lineMaterial stock-entry-line-input" <%= readonly ? 'disabled' : '' %>>
                      <option value="">Select</option>
                      <%_.each(materials, function(material){ %>
                        <option value="<%= material.material_id %>" <%= String(item.material_id || '') === String(material.material_id) ? 'selected' : '' %>>
                          <%= (material.material_code ? material.material_code + ' - ' : '') + (material.material_name || '') %>
                        </option>
                      <% }); %>
                    </select>
                  </td>
                  <td><input type="text" class="lineMaterialCode" value="<%= item.material_code || '' %>" disabled></td>
                  <td>
                    <select class="lineUom stock-entry-line-input" <%= readonly ? 'disabled' : '' %>>
                      <option value="">Select</option>
                      <%_.each(uoms, function(uom){ %>
                        <option value="<%= uom.uom_id %>" <%= String(item.uom_id || '') === String(uom.uom_id) ? 'selected' : '' %>><%= uom.uom_code || uom.uom_name || '' %></option>
                      <% }); %>
                    </select>
                  </td>
                  <td><input type="number" step="0.01" min="0" class="lineQty stock-entry-line-input" value="<%= item.received_qty || 0 %>" <%= readonly ? 'disabled' : '' %>></td>
                  <td><input type="number" step="0.01" min="0" class="lineRate stock-entry-line-input" value="<%= item.rate || 0 %>" <%= readonly ? 'disabled' : '' %>></td>
                  <td><input type="number" step="0.01" class="lineAmount" value="<%= item.line_amount || 0 %>" disabled></td>
                  <td><input type="text" class="lineRemarks stock-entry-line-input" value="<%= item.remarks || '' %>" <%= readonly ? 'disabled' : '' %>></td>
                  <td style="text-align:center;">
                    <% if(!readonly){ %>
                      <i class="material-icons" style="color:red;" onclick="deleteStockEntryItem(<%= index %>)">delete_forever</i>
                    <% } %>
                  </td>
                </tr>
              <% }); %>
            </table>
          </script>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
