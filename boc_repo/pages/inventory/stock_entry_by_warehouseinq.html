<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Stock Entry By Warehouse</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="../../global/libs/jquery/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/stock_entry_by_warehouseinq.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }
</style>

<body>
  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div class="nav-feature-search">
        <span class="material-icons">search</span>
        <input type="text" id="featureSearch" placeholder="Search feature..." autocomplete="off">
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item profile-settings-menu-item" href="javascript:void(0);"><span class="material-icons profile-menu-icon">settings</span><span>Profile Settings</span></a>
            <a class="dropdown-item" href="javascript:void(0);" onclick="functionLogout()"><span class="material-icons profile-menu-icon">logout</span><span>Logout</span></a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;"></div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="sectionDivHead">
        <table width="98%">
          <tr>
            <td class="mainTblHdr">Stock Entry By Warehouse:</td>
          </tr>
        </table>

        <table width="99%">
          <tr>
            <td width="13%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                GRN No:
                <input type="text" id="grnNoSearch" name="grnNoSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="17%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Vendor:
                <input type="text" id="vendorSearch" name="vendorSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="14%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Warehouse:
                <select id="warehouseSearch" name="warehouseSearch"></select>
              </div>
            </td>

            <td width="1%"></td>

            <td width="11%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                From Date:
                <input type="date" id="fromDateSearch" name="fromDateSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="11%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                To Date:
                <input type="date" id="toDateSearch" name="toDateSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="10%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Status:
                <select id="statusSearch" name="statusSearch">
                  <option value="">ALL</option>
                  <option value="Posted">Posted</option>
                  <option value="Draft">Draft</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
            </td>

            <td width="1%"></td>

            <td width="20px" style="vertical-align:middle;">
              <input type="button" value="Search" onclick="search()" class="search">
            </td>

            <td width="20px" style="vertical-align:middle;text-align:right;">
              <div class="tooltip-wrapper">
                <input type="button" value="Add GRN" onclick="addStockEntry()" class="search">
                <div class="tooltip-text">Add stock entry</div>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <br>

      <div class="sectionDiv">
        <div style="width:30%; margin-bottom:10px;">
          <input type="text" id="stockEntryTableSearch" name="stockEntryTableSearch" placeholder="Search table...">
        </div>

        <div id="listContainer2" class="tempalte">
          <script type="text/template" id="listTmpl">
            <table style="width:100%;" class="dataTbl">
              <tr>
                <th width="9%">GRN No</th>
                <th width="9%">GRN Date</th>
                <th width="10%">Reference</th>
                <th width="14%">Vendor</th>
                <th width="13%">Warehouse</th>
                <th width="9%">Status</th>
                <th width="11%">Created</th>
                <th width="4%">View</th>
              </tr>

              <%_.each(goodsReceipts, function(item){ %>
                <tr>
                  <td><b><%= item.goods_receipt_no || '' %></b></td>
                  <td><%= formatDate(item.goods_receipt_date) %></td>
                  <td><%= item.reference_no || item.reference_type || '' %></td>
                  <td><%= item.vendor_name || '' %></td>
                  <td><%= warehouseName(item.warehouse_id) %></td>
                  <td><%= item.status || '' %></td>
                  <td><%= formatDate(item.created_at) %></td>
                  <td onclick="viewStockEntry(<%= item.goods_receipt_id %>)">
                    <div class="tooltip-wrapper"><i class="material-icons">visibility</i><div class="tooltip-text">View Stock Entry</div></div>
                  </td>
                </tr>
              <% }); %>
            </table>
          </script>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
