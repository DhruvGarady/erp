<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Inquiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/jquery/jquery-ui.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="erp-sidebar" id="sidebar">
      <div class="sidebar-rail">
        <button type="button" class="rail-toggle" id="sidebarToggle" aria-label="Toggle sidebar">=</button>
        <div class="rail-avatar" id="railAvatar">U</div>
        <a href="../home.html" class="rail-item active">MD</a>
        <a href="javascript:void(0)" class="rail-item">TR</a>
        <a href="javascript:void(0)" class="rail-item">FN</a>
        <div class="rail-spacer"></div>
      </div>

      <div class="sidebar-panel">
        <div class="panel-head">
          <h2>MASTERDATA</h2>
          <button type="button" class="panel-add">+</button>
        </div>

        <div class="panel-group">
          <div class="panel-label">OVERVIEW</div>
          <a href="../home.html" class="panel-link">Home</a>
        </div>

        <div class="panel-group">
          <div class="panel-label">MASTER DATA</div>
          <a href="customer_inq.html" class="panel-link active role-item" data-roles="Admin,Manager,User">Customers</a>
          <a href="javascript:void(0)" class="panel-link role-item" data-roles="Admin,Manager">Vendors</a>
          <a href="javascript:void(0)" class="panel-link role-item" data-roles="Admin,Manager">Materials</a>
          <a href="javascript:void(0)" class="panel-link role-item" data-roles="Admin">Tax</a>
          <a href="javascript:void(0)" class="panel-link role-item" data-roles="Admin">GL Accounts</a>
        </div>

        <div class="panel-group">
          <div class="panel-label">NEXT MODULES</div>
          <a href="javascript:void(0)" class="panel-link">Transactions</a>
          <a href="javascript:void(0)" class="panel-link">Finance</a>
          <a href="javascript:void(0)" class="panel-link">Reports</a>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="app-topbar">
        <h1>Customer Inquiry</h1>
        <div class="topbar-right">
          <div class="user-meta">
            <p class="user-name" id="userName">User</p>
            <p class="user-role" id="userRole">ERP User</p>
          </div>
        </div>
      </header>

      <section class="content-area" id="contentArea">
        <div class="page-card">
          <div class="page-head">
            <h2>Customer Master</h2>
            <p>Search and manage customer master data.</p>
          </div>

          <div class="toolbar">
            <div class="row align-items-center">
              <div class="col-lg-6 col-md-8 mb-2 mb-md-0">
                <input type="text" id="txtSearch" class="form-control search-input" placeholder="Search by code, name, contact, email, or phone">
              </div>
              <div class="col-lg-6 col-md-4 text-md-right">
                <button type="button" class="btn-primary-custom" id="btnAddCustomer">Add Customer</button>
              </div>
            </div>
          </div>

          <div class="table-wrap table-responsive">
            <table class="table table-hover mb-0" id="customerTable">
              <thead>
                <tr>
                  <th style="width: 70px;">#</th>
                  <th>Customer Code</th>
                  <th>Customer Name</th>
                  <th>Contact Person</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Status</th>
                  <th style="width: 100px;">Action</th>
                </tr>
              </thead>
              <tbody id="customerTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="text/template" id="customerRowTmpl">
    <% if(customers && customers.length){ %>
      <% _.each(customers, function(customer, index){ %>
        <tr>
          <td><%= index + 1 %></td>
          <td><%= customer.customer_code || '-' %></td>
          <td><%= customer.customer_name || '-' %></td>
          <td><%= customer.contact_person || '-' %></td>
          <td><%= customer.email || '-' %></td>
          <td><%= customer.phone || '-' %></td>
          <td>
            <span class="status-pill <%= customer.is_active === 'Y' ? 'status-active' : 'status-inactive' %>">
              <%= customer.is_active === 'Y' ? 'Active' : 'Inactive' %>
            </span>
          </td>
          <td>
            <button type="button" class="btn-edit btnEditCustomer" data-id="<%= customer.customer_id %>">Edit</button>
          </td>
        </tr>
      <% }); %>
    <% } else { %>
      <tr>
        <td colspan="8" class="empty-row">No customer records found.</td>
      </tr>
    <% } %>
  </script>

  <script src="scripts/customer_inq.js"></script>
</body>
</html>
