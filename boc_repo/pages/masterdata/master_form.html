<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">

  <script src="../../global/libs/jquery/jquery.min.js"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js"></script>
  <script src="../../global/global_exp1.js"></script>
  <script src="../../global/properties.js"></script>
  <script src="../../global/erp_shell.js"></script>
  <script src="scripts/masterdata_config.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="erp-sidebar" id="sidebar">
      <div class="sidebar-rail">
        <button type="button" class="rail-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <span class="icon-menu"><span></span><span></span><span></span></span>
        </button>
        <div class="rail-avatar" id="railAvatar">U</div>
        <a href="../home.html" class="rail-item active">MD</a>
        <div class="rail-spacer"></div>
        <button type="button" class="rail-theme" id="themeToggle" aria-label="Toggle theme" data-mode="light"><span class="icon-theme"></span></button>
      </div>
      <div class="sidebar-panel">
        <div class="panel-head"><h2>MASTER DATA</h2></div>
        <div class="panel-group">
          <div class="panel-label">MASTER DATA MENUS</div>
          <div id="mdSideMenu"></div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="app-topbar">
        <h1 id="mdPageTitle">Master Form</h1>
        <div class="topbar-right">
          <div class="user-meta">
            <p class="user-name" id="userName">User</p>
            <p class="user-role" id="userRole">Role</p>
          </div>
          <button type="button" class="btn-ghost" id="logoutBtn">Logout</button>
        </div>
      </header>

      <section class="content-area" id="contentArea">
        <p class="md-page-subtitle" id="mdPageSubtitle"></p>
        <div class="md-hero">
          <div>
            <h2 id="mdHeroTitle">Master Form</h2>
            <p id="mdHeroText"></p>
          </div>
          <div class="md-ready-pill"><span class="md-ready-dot"></span> Ready</div>
        </div>

        <div class="md-form-card">
          <form id="mdForm" class="md-form-body">
            <div class="md-section">
              <h4 class="md-section-title">Details</h4>
              <div class="row" id="mdFields"></div>
            </div>
            <div class="md-form-footer">
              <p class="md-footer-note">Complete required fields before save.</p>
              <div class="md-action-group">
                <button type="button" class="btn-neutral" id="btnDeactivate">Deactivate</button>
                <button type="button" class="btn-neutral" id="btnCancel">Cancel</button>
                <button type="submit" class="btn-primary-strong" id="btnSave">Save</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="scripts/masterdata_form.js"></script>
</body>
</html>
