<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Inquiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">

  <script src="../../global/libs/jquery/jquery.min.js"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js"></script>
  <script src="../../global/global_exp1.js"></script>
  <script src="../../global/properties.js"></script>
  <script src="../../global/erp_shell.js"></script>
  <script src="scripts/masterdata_config.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="erp-sidebar" id="sidebar">
      <div class="sidebar-rail">
        <button type="button" class="rail-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <span class="icon-menu"><span></span><span></span><span></span></span>
        </button>
        <div class="rail-avatar" id="railAvatar">U</div>
        <a href="../home.html" class="rail-item active">MD</a>
        <div class="rail-spacer"></div>
        <button type="button" class="rail-theme" id="themeToggle" aria-label="Toggle theme" data-mode="light"><span class="icon-theme"></span></button>
      </div>
      <div class="sidebar-panel">
        <div class="panel-head"><h2>MASTER DATA</h2></div>
        <div class="panel-group">
          <div class="panel-label">MASTER DATA MENUS</div>
          <div id="mdSideMenu"></div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="app-topbar">
        <h1 id="mdPageTitle">Master Inquiry</h1>
        <div class="topbar-right">
          <div class="user-meta">
            <p class="user-name" id="userName">User</p>
            <p class="user-role" id="userRole">Role</p>
          </div>
          <button type="button" class="btn-ghost" id="logoutBtn">Logout</button>
        </div>
      </header>

      <section class="content-area" id="contentArea">
        <p class="md-page-subtitle" id="mdPageSubtitle"></p>
        <div class="md-hero">
          <div>
            <h2 id="mdHeroTitle">Master</h2>
            <p id="mdHeroText"></p>
          </div>
          <button type="button" class="btn-primary-strong" id="btnAdd">Add</button>
        </div>

        <div class="md-form-card">
          <div class="toolbar">
            <div class="row align-items-center">
              <div class="col-md-8 mb-2 mb-md-0">
                <input type="text" id="txtSearch" class="md-input" placeholder="Search">
              </div>
              <div class="col-md-4">
                <select id="fltStatus" class="md-select">
                  <option value="Y">Active</option>
                  <option value="">All</option>
                  <option value="N">Inactive</option>
                </select>
              </div>
            </div>
          </div>
          <div class="table-wrap table-responsive">
            <table class="table table-hover mb-0">
              <thead id="mdTableHead"></thead>
              <tbody id="mdTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="scripts/masterdata_inq.js"></script>
</body>
</html>
