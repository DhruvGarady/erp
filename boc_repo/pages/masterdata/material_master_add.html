<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Material Master Add/Edit</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/material_master_add.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  label {
    margin-bottom: 0 !important;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }
</style>

<body>

  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="#">Profile</a>
            <a class="dropdown-item" onclick="functionLogout()">Logout</a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;">
        <script type="text/template" id="menuTmpl">
          <%_.each(parentFeatures, function(item, index){ %>
            <table class="menuTable" id="menuTable" style="width:100%; overflow-y:auto;">
              <tr class="menuTr" id="menuTr" title="<%= item.feature_description %>">
                <td class="menuTd" id="menuTd" width="10%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons"><%= item.icon %></i></td>
                <td class="menuTd" id="menuTd" width="90%" onclick="linkPage('<%= item.feature_url %>')"><div class="tooltip-wrapper"><%= (item.feature_name) %><div class="tooltip-text"><%= (item.feature_description) %></div></div></td>
                <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                  <td class="menuTd" id="menuTd" width="1%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons">arrow_drop_down</i></td>
                <% }%>
              </tr>

              <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                <%_.each(item.childFeatures, function(oitem, index){ %>
                  <tr class="menuTr" id="menuTr" title="<%= oitem.feature_description %>">
                    <td class="submenuTd" id="submenuTd" width="10%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                    <td class="submenuTd" id="submenuTd" width="90%" onclick="linkPage('<%= oitem.feature_url %>')"><div class="tooltip-wrapper"><%= oitem.feature_name %><div class="tooltip-text"><%= (oitem.feature_description) %></div></div></td>
                    <td class="submenuTd" id="submenuTd" width="1%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                  </tr>
                <% }); %>
              <% }%>
            </table>
          <% }); %>
        </script>
      </div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="fullSectionDiv">
        <table width="100%">
          <tr>
            <td width="70%" class="mainTblHdr" id="pageTitle">Material Information:</td>
            <td style="text-align:right;">
              <button onclick="saveMaterial()" class="searchButton">
                <span class="material-icons">save</span>
                <span>Save</span>
              </button>
              <button onclick="backToInquiry()" class="searchButton">
                <span>Back</span>
              </button>
            </td>
          </tr>
        </table>

        <br>
        <ul class="nav nav-tabs" id="materialTab" role="tablist">
          <li class="nav-item"><a class="nav-link active" id="basic-tab" data-toggle="tab" href="#basic" role="tab">Basic</a></li>
          <li class="nav-item"><a class="nav-link" id="uom-tab" data-toggle="tab" href="#uom" role="tab">UOM & Accounting</a></li>
          <li class="nav-item"><a class="nav-link" id="planning-tab" data-toggle="tab" href="#planning" role="tab">Planning</a></li>
        </ul>

        <div class="tab-content border" id="materialTabContent">
          <div class="tab-pane fade show active" id="basic" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Material Code <span style="color:red;">*</span>
                    <input type="text" id="material_code" name="material_code">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Material Name <span style="color:red;">*</span>
                    <input type="text" id="material_name" name="material_name">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Material Type
                    <select id="material_type" name="material_type">
                      <option value="">Select</option>
                      <option value="RAW MATERIAL">RAW MATERIAL</option>
                      <option value="SEMI FINISHED GOODS">SEMI FINISHED GOODS</option>
                      <option value="FINISHED GOODS">FINISHED GOODS</option>
                    </select>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Material Category <span style="color:red;">*</span>
                    <select id="material_group_id" name="material_group_id"></select>
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    Status
                    <select id="is_active" name="is_active">
                      <option value="Y">Active</option>
                      <option value="N">Inactive</option>
                    </select>
                  </div>
                </td>
                <td></td>
                <td colspan="5">
                  <div class="form-group">
                    Description
                    <textarea id="material_description" name="material_description" rows="2"></textarea>
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <div class="tab-pane fade" id="uom" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Base UOM <span style="color:red;">*</span>
                    <select id="base_uom_id" name="base_uom_id"></select>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Purchase UOM
                    <select id="purchase_uom_id" name="purchase_uom_id"></select>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Sales UOM
                    <select id="sales_uom_id" name="sales_uom_id"></select>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Currency
                    <select id="currency_id" name="currency_id"></select>
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    Tax
                    <select id="tax_id" name="tax_id"></select>
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    HSN/SAC Code
                    <input type="text" id="hsn_sac_code" name="hsn_sac_code">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Standard Rate
                    <input type="number" id="standard_rate" name="standard_rate" step="0.01">
                  </div>
                </td>
                <td></td>
                <td></td>
              </tr>
            </table>
          </div>

          <div class="tab-pane fade" id="planning" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Reorder Level
                    <input type="number" id="reorder_level" name="reorder_level" step="0.01">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Min Stock
                    <input type="number" id="min_stock" name="min_stock" step="0.01">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Max Stock
                    <input type="number" id="max_stock" name="max_stock" step="0.01">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%"></td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
