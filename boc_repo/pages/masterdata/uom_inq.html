<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UOM Inquiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">

  <script src="../../global/libs/jquery/jquery.min.js"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js"></script>
  <script src="../../global/global_exp1.js"></script>
  <script src="../../global/properties.js"></script>
  <script src="../../global/erp_shell.js"></script>
  <script src="scripts/masterdata_config.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="erp-sidebar" id="sidebar">
      <div class="sidebar-rail">
        <button type="button" class="rail-toggle" id="sidebarToggle" aria-label="Toggle sidebar"><span class="icon-menu"><span></span><span></span><span></span></span></button>
        <div class="rail-avatar" id="railAvatar">U</div>
        <a href="../home.html" class="rail-item active">MD</a>
        <div class="rail-spacer"></div>
        <button type="button" class="rail-theme" id="themeToggle" aria-label="Toggle theme" data-mode="light"><span class="icon-theme"></span></button>
      </div>
      <div class="sidebar-panel">
        <div class="panel-head"><h2>MASTER DATA</h2></div>
        <div class="panel-group">
          <div class="panel-label">MASTER DATA MENUS</div>
          <div id="mdSideMenu"></div>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="app-topbar">
        <h1 id="spTopTitle">UOM Inquiry</h1>
        <div class="topbar-right">
          <div class="user-meta">
            <p class="user-name" id="userName">User</p>
            <p class="user-role" id="userRole">Role</p>
          </div>
          <button type="button" class="btn-ghost" id="logoutBtn">Logout</button>
        </div>
      </header>

      <section class="content-area" id="contentArea">
        <main class="sp-content">
          <section class="sp-hero">
            <div class="sp-hero-top">
              <div>
                <h2 id="spHeroTitle"></h2>
                <p id="spHeroText"></p>
              </div>
              <div class="sp-actions">
                <button type="button" class="sp-btn-outline" id="spBtnExport">Export</button>
                <button type="button" class="sp-btn-soft" id="spBtnRefresh">Refresh</button>
                <button type="button" class="sp-btn-primary" id="spBtnAdd"></button>
              </div>
            </div>
          </section>

          <section class="sp-card">
            <div class="sp-card-head">
              <h3 id="spCardTitle"></h3>
              <small>Search and maintain records from one clean list screen.</small>
            </div>
            <div class="sp-search-row">
              <div class="row align-items-center">
                <div class="col-md-9 mb-2 mb-md-0">
                  <input type="text" id="spSearch" class="sp-input" placeholder="Search records">
                </div>
                <div class="col-md-3 text-md-right">
                  <button type="button" class="sp-btn-primary w-100" id="spBtnSearch">Search</button>
                </div>
              </div>
            </div>
            <div class="sp-table-wrap table-responsive">
              <table class="table sp-table mb-0">
                <thead id="spTableHead"></thead>
                <tbody id="spTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="sp-card">
            <div class="sp-card-head">
              <h3 id="spFormTitle"></h3>
              <small>Use the same form for both create and update operations.</small>
            </div>
            <form id="spForm">
              <div class="sp-form-body">
                <div class="sp-section-title">Details</div>
                <div class="row" id="spFormFields"></div>
              </div>
              <div class="sp-footer">
                <div class="sp-note">Required fields should be completed before save.</div>
                <div class="sp-footer-actions">
                  <button type="button" class="sp-btn-cancel" id="spDeactivateBtn">Deactivate</button>
                  <button type="button" class="sp-btn-cancel" id="spCancelBtn">Cancel</button>
                  <button type="submit" class="sp-btn-save" id="spSaveBtn">Save</button>
                </div>
              </div>
            </form>
          </section>
        </main>
      </section>
    </main>
  </div>

  <script>window.MASTER_ENTITY = "uom";</script>
  <script src="master_singlepage.js"></script>
</body>
</html>
