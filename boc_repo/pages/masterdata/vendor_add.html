<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Vendor Master Add/Edit</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/vendor_add.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  label {
    margin-bottom: 0 !important;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }
</style>

<body>

  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div class="nav-feature-search">
        <span class="material-icons">search</span>
        <input type="text" id="featureSearch" placeholder="Search feature..." autocomplete="off">
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item profile-settings-menu-item" href="javascript:void(0);"><span class="material-icons profile-menu-icon">settings</span><span>Profile Settings</span></a>
            <a class="dropdown-item" href="javascript:void(0);" onclick="functionLogout()"><span class="material-icons profile-menu-icon">logout</span><span>Logout</span></a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;">
        <script type="text/template" id="menuTmpl">
          <%_.each(parentFeatures, function(item, index){ %>
            <table class="menuTable" id="menuTable" style="width:100%; overflow-y:auto;">
              <tr class="menuTr" id="menuTr" title="<%= item.feature_description %>">
                <td class="menuTd" id="menuTd" width="10%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons"><%= item.icon %></i></td>
                <td class="menuTd" id="menuTd" width="90%" onclick="linkPage('<%= item.feature_url %>')"><div class="tooltip-wrapper"><%= (item.feature_name) %><div class="tooltip-text"><%= (item.feature_description) %></div></div></td>
                <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                  <td class="menuTd" id="menuTd" width="1%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons">arrow_drop_down</i></td>
                <% }%>
              </tr>

              <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                <%_.each(item.childFeatures, function(oitem, index){ %>
                  <tr class="menuTr" id="menuTr" title="<%= oitem.feature_description %>">
                    <td class="submenuTd" id="submenuTd" width="10%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                    <td class="submenuTd" id="submenuTd" width="90%" onclick="linkPage('<%= oitem.feature_url %>')"><div class="tooltip-wrapper"><%= oitem.feature_name %><div class="tooltip-text"><%= (oitem.feature_description) %></div></div></td>
                    <td class="submenuTd" id="submenuTd" width="1%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                  </tr>
                <% }); %>
              <% }%>
            </table>
          <% }); %>
        </script>
      </div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="fullSectionDiv">
        <table width="100%">
          <tr>
            <td width="85%" class="mainTblHdr" id="pageTitle">Vendor Information:</td>

            <td style="text-align:right;">
              <button onclick="backToInquiry()" class="searchButton bg-danger">
                <span class="material-icons">arrow_back</span>
                <span>Back</span>
              </button>
            </td>
            <td width="1%"></td>
            <td style="text-align:right;">
              <button onclick="saveVendor()" class="searchButton bg-primary">
                <span class="material-icons">save</span>
                <span>Save</span>
              </button>
            </td>
          </tr>
        </table>

        <br>
        <ul class="nav nav-tabs" id="vendorTab" role="tablist">
          <li class="nav-item"><a class="nav-link active" id="basic-tab" data-toggle="tab" href="#basic" role="tab">Basic</a></li>
          <li class="nav-item"><a class="nav-link" id="commercial-tab" data-toggle="tab" href="#commercial" role="tab">Commercial</a></li>
          <li class="nav-item"><a class="nav-link" id="address-tab" data-toggle="tab" href="#address" role="tab">Address</a></li>
        </ul>

        <div class="tab-content border" id="vendorTabContent">
          <div class="tab-pane fade show active" id="basic" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Vendor Code <span style="color:red;">*</span>
                    <input type="text" id="vendor_code" name="vendor_code">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Vendor Name <span style="color:red;">*</span>
                    <input type="text" id="vendor_name" name="vendor_name">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Vendor Type
                    <input type="text" id="vendor_type" name="vendor_type">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Contact Person
                    <input type="text" id="contact_person" name="contact_person">
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    Email
                    <input type="email" id="email" name="email">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Phone
                    <input type="text" id="phone" name="phone">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Alternate Phone
                    <input type="text" id="alt_phone" name="alt_phone">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Status
                    <select id="is_active" name="is_active">
                      <option value="Y">Active</option>
                      <option value="N">Inactive</option>
                    </select>
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <div class="tab-pane fade" id="commercial" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    GST No
                    <input type="text" id="gst_no" name="gst_no">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    PAN No
                    <input type="text" id="pan_no" name="pan_no">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Payment Term
                    <input type="text" id="payment_term" name="payment_term">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%"></td>
              </tr>
              <tr>
                <td colspan="7">
                  <div class="form-group">
                    Remarks
                    <textarea id="remarks" name="remarks" rows="2"></textarea>
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <div class="tab-pane fade" id="address" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="47%">
                  <div class="form-group">
                    Billing Address
                    <textarea id="billing_address" name="billing_address" rows="3"></textarea>
                  </div>
                </td>
                <td width="6%"></td>
                <td width="47%">
                  <div class="form-group">
                    Shipping Address
                    <textarea id="shipping_address" name="shipping_address" rows="3"></textarea>
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    City
                    <input type="text" id="city" name="city">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    State
                    <input type="text" id="state" name="state">
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    Country
                    <input type="text" id="country" name="country">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Pincode
                    <input type="text" id="pincode" name="pincode">
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
