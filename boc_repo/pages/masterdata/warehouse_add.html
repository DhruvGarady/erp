<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Warehouse Add/Edit</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/warehouse_add.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  label {
    margin-bottom: 0 !important;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }
</style>

<body>

  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div class="nav-feature-search">
        <span class="material-icons">search</span>
        <input type="text" id="featureSearch" placeholder="Search feature..." autocomplete="off">
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item profile-settings-menu-item" href="javascript:void(0);"><span class="material-icons profile-menu-icon">settings</span><span>Profile Settings</span></a>
            <a class="dropdown-item" href="javascript:void(0);" onclick="functionLogout()"><span class="material-icons profile-menu-icon">logout</span><span>Logout</span></a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;"></div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="fullSectionDiv">
        <table width="100%">
          <tr>
            <td width="85%" class="mainTblHdr" id="pageTitle">Warehouse Information:</td>

            <td style="text-align:right;">
              <button onclick="backToInquiry()" class="searchButton bg-danger">
                <span class="material-icons">arrow_back</span>
                <span>Back</span>
              </button>
            </td>
            <td width="1%"></td>
            <td style="text-align:right;">
              <button onclick="saveWarehouse()" class="searchButton bg-primary">
                <span class="material-icons">save</span>
                <span>Save</span>
              </button>
            </td>
          </tr>
        </table>

        <br>
        <ul class="nav nav-tabs" id="warehouseTab" role="tablist">
          <li class="nav-item"><a class="nav-link active" id="basic-tab" data-toggle="tab" href="#basic" role="tab">Basic</a></li>
          <li class="nav-item"><a class="nav-link" id="contact-tab" data-toggle="tab" href="#contact" role="tab">Contact</a></li>
          <li class="nav-item"><a class="nav-link" id="address-tab" data-toggle="tab" href="#address" role="tab">Address</a></li>
        </ul>

        <div class="tab-content border" id="warehouseTabContent">
          <div class="tab-pane fade show active" id="basic" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Warehouse Code <span style="color:red;">*</span>
                    <input type="text" id="warehouse_code" name="warehouse_code">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="30%">
                  <div class="form-group">
                    Warehouse Name <span style="color:red;">*</span>
                    <input type="text" id="warehouse_name" name="warehouse_name">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Warehouse Type
                    <input type="text" id="warehouse_type" name="warehouse_type">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="15%">
                  <div class="form-group">
                    Status
                    <select id="is_active" name="is_active">
                      <option value="Y">Active</option>
                      <option value="N">Inactive</option>
                    </select>
                  </div>
                </td>
              </tr>

              <tr>
                <td colspan="7">
                  <div class="form-group">
                    Remarks
                    <textarea id="remarks" name="remarks" rows="3"></textarea>
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <div class="tab-pane fade" id="contact" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="30%">
                  <div class="form-group">
                    Contact Person
                    <input type="text" id="contact_person" name="contact_person">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="30%">
                  <div class="form-group">
                    Phone
                    <input type="text" id="phone" name="phone">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="30%">
                  <div class="form-group">
                    Email
                    <input type="email" id="email" name="email">
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <div class="tab-pane fade" id="address" role="tabpanel" style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="47%">
                  <div class="form-group">
                    Address Line 1
                    <textarea id="address_line1" name="address_line1" rows="3"></textarea>
                  </div>
                </td>
                <td width="6%"></td>
                <td width="47%">
                  <div class="form-group">
                    Address Line 2
                    <textarea id="address_line2" name="address_line2" rows="3"></textarea>
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    City
                    <input type="text" id="city" name="city">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    State
                    <input type="text" id="state" name="state">
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    Country
                    <input type="text" id="country" name="country">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Pincode
                    <input type="text" id="pincode" name="pincode">
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
