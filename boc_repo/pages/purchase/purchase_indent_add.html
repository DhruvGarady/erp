<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Purchase Indent Add/Edit</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="../../global/libs/jquery/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/purchase_indent_add.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }

  .indent-line-input,
  .indent-line-select {
    width: 100%;
  }
</style>

<body>

  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div class="nav-feature-search">
        <span class="material-icons">search</span>
        <input type="text" id="featureSearch" placeholder="Search feature..." autocomplete="off">
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item profile-settings-menu-item" href="javascript:void(0);"><span class="material-icons profile-menu-icon">settings</span><span>Profile Settings</span></a>
            <a class="dropdown-item" href="javascript:void(0);" onclick="functionLogout()"><span class="material-icons profile-menu-icon">logout</span><span>Logout</span></a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;"></div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="sectionDivHead">
        <table width="100%">
          <tr>
            <td width="70%" class="mainTblHdr" id="pageTitle">Purchase Indent Information:</td>

            <td style="text-align:right;">
              <button onclick="backToInquiry()" class="searchButton bg-danger">
                <span class="material-icons">arrow_back</span>
                <span>Back</span>
              </button>
            </td>
            <td width="1%"></td>
            <td style="text-align:right;">
              <button data-perm-save onclick="saveIndent()" class="searchButton bg-primary">
                <span class="material-icons">save</span>
                <span>Save</span>
              </button>
            </td>
          </tr>
        </table>

        <br>

        <div class="tab-content border" style="margin:0;">
          <div style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Indent No
                    <input type="text" id="indent_no" name="indent_no" readonly>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Indent Date <span style="color:red;">*</span>
                    <input type="date" id="indent_date" name="indent_date">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Required By <span style="color:red;">*</span>
                    <input type="date" id="required_by_date" name="required_by_date">
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Priority
                    <select id="priority" name="priority">
                      <option value="Low">Low</option>
                      <option value="Normal" selected>Normal</option>
                      <option value="High">High</option>
                      <option value="Urgent">Urgent</option>
                    </select>
                  </div>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="form-group">
                    Department <span style="color:red;">*</span>
                    <input type="text" id="department" name="department">
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Requested By
                    <input type="text" id="requested_by_name" name="requested_by_name" readonly>
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Deliver To Warehouse
                    <select id="warehouse_id" name="warehouse_id"></select>
                  </div>
                </td>
                <td></td>
                <td>
                  <div class="form-group">
                    Reference No
                    <input type="text" id="reference_no" name="reference_no">
                  </div>
                </td>
              </tr>

              <tr>
                <td colspan="3">
                  <div class="form-group">
                    Purpose
                    <input type="text" id="purpose" name="purpose">
                  </div>
                </td>
                <td></td>
                <td colspan="3">
                  <div class="form-group">
                    Remarks
                    <input type="text" id="remarks" name="remarks">
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </div>

        <div id="workflowPanel" class="tab-content border" style="margin-top:12px; display:none;">
          <div style="margin:17px;">
            <table width="100%">
              <tr>
                <td width="20%">
                  <div class="form-group">
                    Status
                    <input type="text" id="statusDisplay" name="statusDisplay" readonly>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Approval Status
                    <input type="text" id="approvalStatusDisplay" name="approvalStatusDisplay" readonly>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="20%">
                  <div class="form-group">
                    Decided By
                    <input type="text" id="approvedByDisplay" name="approvedByDisplay" readonly>
                  </div>
                </td>
                <td width="5%"></td>
                <td width="25%">
                  <div class="form-group">
                    Approval Remarks
                    <input type="text" id="approvalRemarksDisplay" name="approvalRemarksDisplay" readonly>
                  </div>
                </td>
              </tr>
            </table>
          </div>
        </div>
      </div>

      <br>

      <div class="sectionDiv">
        <table width="100%">
          <tr>
            <td class="mainTblHdr">Indent Items:</td>
            <td style="text-align:right;">
              <input type="button" id="addRowButton" value="Add Row" onclick="addIndentItem()" class="search">
            </td>
          </tr>
        </table>

        <div id="indentItemsContainer">
          <script type="text/template" id="indentItemsTmpl">
            <table style="width:100%;" class="dataTbl">
              <tr>
                <th width="4%">Line</th>
                <th width="20%">Material</th>
                <th width="9%">Code</th>
                <th width="17%">Description</th>
                <th width="8%">Qty</th>
                <th width="9%">UOM</th>
                <th width="10%">Required By</th>
                <th width="9%">Est. Rate</th>
                <th width="9%">Est. Value</th>
                <th width="3%" style="text-align:center;">Del</th>
              </tr>

              <% if(!items || items.length === 0){ %>
                <tr>
                  <td colspan="10" style="text-align:center;">No indent items added.</td>
                </tr>
              <% } %>

              <%_.each(items, function(item, index){ %>
                <tr data-index="<%= index %>">
                  <td><%= index + 1 %></td>
                  <td>
                    <select class="indent-line-select lineMaterial">
                      <option value="">Select</option>
                      <%_.each(materials, function(material){ %>
                        <option value="<%= material.material_id %>" <%= String(item.material_id || '') === String(material.material_id) ? 'selected' : '' %>><%= material.material_code ? material.material_code + ' - ' : '' %><%= material.material_name || '' %></option>
                      <% }); %>
                    </select>
                  </td>
                  <td><input type="text" class="indent-line-input lineMaterialCode" value="<%= item.material_code || '' %>" readonly></td>
                  <td><input type="text" class="indent-line-input lineDescription" value="<%= item.item_description || '' %>"></td>
                  <td><input type="number" class="indent-line-input lineQty" min="0" step="0.01" value="<%= item.qty || 1 %>"></td>
                  <td>
                    <select class="indent-line-select lineUom">
                      <option value="">Select</option>
                      <%_.each(uoms, function(uom){ %>
                        <option value="<%= uom.uom_id %>" <%= String(item.uom_id || '') === String(uom.uom_id) ? 'selected' : '' %>><%= uom.uom_code || uom.uom_name || '' %></option>
                      <% }); %>
                    </select>
                  </td>
                  <td><input type="date" class="indent-line-input lineRequiredBy" value="<%= normalizeDate(item.required_by_date) %>"></td>
                  <td><input type="number" class="indent-line-input lineRate" min="0" step="0.01" value="<%= item.estimated_rate || 0 %>"></td>
                  <td style="text-align:right;"><span class="lineValueLabel"><%= formatAmount(item.estimated_value || 0) %></span></td>
                  <td style="text-align:center;" onclick="deleteIndentItem(<%= index %>)"><i class="material-icons" style="color: red;">delete_forever</i></td>
                </tr>
              <% }); %>

              <tr>
                <td colspan="8" style="text-align:right;"><b>Estimated Total</b></td>
                <td style="text-align:right;"><b id="estimatedTotalLabel"><%= formatAmount(estimatedTotal) %></b></td>
                <td></td>
              </tr>
            </table>
          </script>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
