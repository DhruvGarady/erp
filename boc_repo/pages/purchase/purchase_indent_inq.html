<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Purchase Indent Inquiry</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="../../global/libs/jquery/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/purchase_indent_inq.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }
</style>

<body>

  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div class="nav-feature-search">
        <span class="material-icons">search</span>
        <input type="text" id="featureSearch" placeholder="Search feature..." autocomplete="off">
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item profile-settings-menu-item" href="javascript:void(0);"><span class="material-icons profile-menu-icon">settings</span><span>Profile Settings</span></a>
            <a class="dropdown-item" href="javascript:void(0);" onclick="functionLogout()"><span class="material-icons profile-menu-icon">logout</span><span>Logout</span></a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;"></div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="sectionDivHead">
        <table width="98%">
          <tr>
            <td class="mainTblHdr">Purchase Indent Inquiry:</td>
          </tr>
        </table>

        <table width="99%">
          <tr>
            <td width="13%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Indent No:
                <input type="text" id="indentNoSearch" name="indentNoSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="13%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Department:
                <input type="text" id="departmentSearch" name="departmentSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="12%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                From Date:
                <input type="date" id="fromDateSearch" name="fromDateSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="12%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                To Date:
                <input type="date" id="toDateSearch" name="toDateSearch">
              </div>
            </td>

            <td width="1%"></td>

            <td width="11%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Status:
                <select id="statusSearch" name="statusSearch">
                  <option value="">ALL</option>
                  <option value="Draft">Draft</option>
                  <option value="Submitted">Submitted</option>
                  <option value="Approved">Approved</option>
                  <option value="Rejected">Rejected</option>
                </select>
              </div>
            </td>

            <td width="1%"></td>

            <td width="10%" style="vertical-align:bottom;">
              <div class="form-group" style="margin-bottom:none;">
                Priority:
                <select id="prioritySearch" name="prioritySearch">
                  <option value="">ALL</option>
                  <option value="Low">Low</option>
                  <option value="Normal">Normal</option>
                  <option value="High">High</option>
                  <option value="Urgent">Urgent</option>
                </select>
              </div>
            </td>

            <td width="1%"></td>

            <td width="20px" style="vertical-align:middle;">
              <input type="button" value="Search" onclick="search()" class="search">
            </td>

            <td width="5%"></td>

            <td width="20px" style="vertical-align:middle;text-align:right;">
              <div class="tooltip-wrapper">
                <input type="button" value="Add Indent" onclick="addIndent()" data-perm="create" class="search">
                <div class="tooltip-text">Raise a new purchase indent</div>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <br>

      <div class="sectionDiv">
        <div style="width:30%; margin-bottom:10px;">
          <input type="text" id="indentTableSearch" name="indentTableSearch" placeholder="Search table...">
        </div>

        <div id="listContainer2" class="tempalte">
          <script type="text/template" id="listTmpl">
            <table style="width:100%;" class="dataTbl">
              <tr>
                <th width="10%">Indent No</th>
                <th width="9%">Indent Date</th>
                <th width="9%">Required By</th>
                <th width="12%">Department</th>
                <th width="13%">Requested By</th>
                <th width="7%">Priority</th>
                <th width="9%">Status</th>
                <th width="12%">Approved By</th>
                <th width="10%">Est. Value</th>
                <th data-perm="edit" width="3%">Submit</th>
                <th data-perm="approve" width="3%">Approve</th>
                <th data-perm="approve" width="3%">Reject</th>
                <th data-perm="edit" width="3%">Edit</th>
                <th data-perm="delete" width="3%" style="text-align:center;">Del</th>
              </tr>

              <% if(!indents || indents.length === 0){ %>
                <tr>
                  <td colspan="14" style="text-align:center;">No purchase indents found.</td>
                </tr>
              <% } %>

              <%_.each(indents, function(item){ %>
                <tr>
                  <td><b><%= item.indent_no || '' %></b></td>
                  <td><%= formatDate(item.indent_date) %></td>
                  <td><%= formatDate(item.required_by_date) %></td>
                  <td><%= item.department || '' %></td>
                  <td><%= item.requested_by_name || '' %></td>
                  <td><%= item.priority || '' %></td>
                  <td><%= item.status || '' %></td>
                  <td><%= item.approved_by_name || '' %></td>
                  <td style="text-align:right;"><%= formatAmount(item.estimated_total) %></td>
                  <td data-perm="edit" data-perm-cell style="text-align:center;">
                    <% if(canSubmitIndent(item)){ %>
                      <div class="tooltip-wrapper" onclick="submitIndent(<%= item.purchase_indent_id %>)"><i class="material-icons" style="color:#2878eb;">send</i><div class="tooltip-text">Send for approval</div></div>
                    <% } %>
                  </td>
                  <td data-perm="approve" data-perm-cell style="text-align:center;">
                    <% if(canDecideIndent(item)){ %>
                      <div class="tooltip-wrapper" onclick="approveIndent(<%= item.purchase_indent_id %>)"><i class="material-icons" style="color:#1a9f55;">verified</i><div class="tooltip-text">Approve indent</div></div>
                    <% } %>
                  </td>
                  <td data-perm="approve" data-perm-cell style="text-align:center;">
                    <% if(canDecideIndent(item)){ %>
                      <div class="tooltip-wrapper" onclick="rejectIndent(<%= item.purchase_indent_id %>)"><i class="material-icons" style="color:#d9534f;">cancel</i><div class="tooltip-text">Reject indent</div></div>
                    <% } %>
                  </td>
                  <td data-perm="edit" data-perm-cell style="text-align:center;">
                    <% if(canEditIndent(item)){ %>
                      <div class="tooltip-wrapper" onclick="editIndent(<%= item.purchase_indent_id %>)"><i class="material-icons">edit</i><div class="tooltip-text">Edit indent</div></div>
                    <% } else { %>
                      <div class="tooltip-wrapper" onclick="viewIndent(<%= item.purchase_indent_id %>)"><i class="material-icons" style="color:#6c757d;">visibility</i><div class="tooltip-text">View indent</div></div>
                    <% } %>
                  </td>
                  <td data-perm="delete" data-perm-cell style="text-align:center;">
                    <% if(canEditIndent(item)){ %>
                      <i class="material-icons" style="color: red;" onclick="deleteIndent(<%= item.purchase_indent_id %>)">delete_forever</i>
                    <% } %>
                  </td>
                </tr>
              <% }); %>
            </table>
          </script>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
