<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <title>Quotation Add/Edit</title>
  <link rel="shortcut icon" href="../../global/css/images/images.png">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../global/css/style_et_1.css">
  <link rel="stylesheet" href="../../global/libs/jquery/jquery-ui.css">

  <script src="../../global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-ui.js" type="text/javascript"></script>
  <script src="../../global/libs/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="../../global/libs/underscore/underscore.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery-validation.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/jquery_modal.js" type="text/javascript"></script>
  <script src="../../global/libs/jquery/xlsx.full.min.js" type="text/javascript"></script>
  <script src="../../global/global_exp1.js" type="text/javascript"></script>
  <script src="../../global/properties.js" type="text/javascript"></script>

  <script src="scripts/quotation_add.js"></script>
</head>

<style>
  body {
    margin: 0;
    height: 100%;
  }

  label {
    margin-bottom: 0 !important;
  }

  .btn.dropdown-toggle::after {
    display: none !important;
  }

  .quotation-line-input,
  .quotation-line-select {
    width: 100%;
    min-height: 28px;
  }

  .quotation-items-template {
    height: 82%;
    width: 99%;
    border: 1px solid #ddd;
    overflow: auto;
  }

  .quotation-items-template .dataTbl {
    min-width: 1400px;
  }

  .quotation-items-section {
    height: 45vh;
  }

  .quotation-total-input {
    width: 100px;
    min-height: 28px;
    text-align: right;
  }
</style>

<body>

  <nav class="navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center mainNav">
      <div class="d-flex align-items-center">
        <a class="navbar-brand m-0" href="../home.html">
          <img src="../../global/css/images/logo2.png" alt="Logo" height="40">
        </a>
        <i class="material-icons ml-2" style="cursor:pointer;font-size: 28px; color:white;" onclick="collapseMenu()">menu</i>
      </div>

      <div>
        <div class="btn-group dropleft">
          <button type="button" class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="userName"></button>
          <div class="dropdown-menu">
            <a class="dropdown-item" href="#">Profile</a>
            <a class="dropdown-item" onclick="functionLogout()">Logout</a>
          </div>
          <img src="" id="profilePicture" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        </div>
      </div>
    </div>
  </nav>

  <div class="row">
    <div class="col-sm-2 sideMenuDivCol">
      <div id="menuContainer" style="overflow-y:auto;">
        <script type="text/template" id="menuTmpl">
          <%_.each(parentFeatures, function(item, index){ %>
            <table class="menuTable" id="menuTable" style="width:100%; overflow-y:auto;">
              <tr class="menuTr" id="menuTr">
                <td class="menuTd" id="menuTd" width="10%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons"><%= item.icon %></i></td>
                <td class="menuTd" id="menuTd" width="90%" onclick="linkPage('<%= item.feature_url %>')"><%= (item.feature_name) %></td>
                <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                  <td class="menuTd" id="menuTd" width="1%" onclick="linkPage('<%= item.feature_url %>')"><i class="material-icons">arrow_drop_down</i></td>
                <% }%>
              </tr>

              <% if(item.childFeatures != null && item.childFeatures != undefined && item.childFeatures != ""){%>
                <%_.each(item.childFeatures, function(oitem, index){ %>
                  <tr class="menuTr" id="menuTr">
                    <td class="submenuTd" id="submenuTd" width="10%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                    <td class="submenuTd" id="submenuTd" width="90%" onclick="linkPage('<%= oitem.feature_url %>')"><%= oitem.feature_name %></td>
                    <td class="submenuTd" id="submenuTd" width="1%" onclick="linkPage('<%= oitem.feature_url %>')"></td>
                  </tr>
                <% }); %>
              <% }%>
            </table>
          <% }); %>
        </script>
      </div>
    </div>

    <div class="col-sm-10 mainDiv">
      <div class="sectionDivHead">
        <table width="100%">
          <tr>
            <td width="85%" class="mainTblHdr" id="pageTitle">Quotation Information:</td>

            <td style="text-align:right;">
              <button onclick="backToInquiry()" class="searchButton bg-danger">
                <span class="material-icons">arrow_back</span>
                <span>Back</span>
              </button>
            </td>
            <td width="1%"></td>
            <td style="text-align:right;">
              <button onclick="saveQuotation()" class="searchButton bg-primary">
                <span class="material-icons">save</span>
                <span>Save</span>
              </button>
            </td>
          </tr>
        </table>

        <table width="100%">
          <tr>
            <td width="18%">
              <div class="form-group">
                Quotation No <span style="color:red;">*</span>
                <input type="text" id="quotation_no" name="quotation_no">
              </div>
            </td>
            <td width="2%"></td>
            <td width="18%">
              <div class="form-group">
                Quotation Date <span style="color:red;">*</span>
                <input type="date" id="quotation_date" name="quotation_date">
              </div>
            </td>
            <td width="2%"></td>
            <td width="24%">
              <div class="form-group">
                Customer <span style="color:red;">*</span>
                <select id="customer_id" name="customer_id" onchange="onCustomerChange()"></select>
              </div>
            </td>
            <td width="2%"></td>
            <td width="16%">
              <div class="form-group">
                Customer Contact
                <input type="text" id="customer_contact" name="customer_contact">
              </div>
            </td>
            <td width="2%"></td>
            <td width="16%">
              <div class="form-group">
                Valid Till
                <input type="date" id="valid_till" name="valid_till">
              </div>
            </td>
          </tr>

          <tr>
            <td>
              <div class="form-group">
                Reference No
                <input type="text" id="reference_no" name="reference_no">
              </div>
            </td>
            <td></td>
            <td colspan="3">
              <div class="form-group">
                Subject
                <input type="text" id="subject" name="subject">
              </div>
            </td>
            <td></td>
            <td>
              <div class="form-group">
                Currency
                <select id="currency" name="currency"></select>
              </div>
            </td>
            <td></td>
            <td>
              <div class="form-group">
                Status
                <select id="status" name="status">
                  <option value="Draft">Draft</option>
                  <option value="Sent">Sent</option>
                  <option value="Approved">Approved</option>
                  <option value="Rejected">Rejected</option>
                </select>
              </div>
            </td>
          </tr>

          <tr>
            <td colspan="3">
              <div class="form-group">
                Notes
                <textarea id="notes" name="notes" rows="2"></textarea>
              </div>
            </td>
            <td></td>
            <td colspan="3">
              <div class="form-group">
                Terms & Conditions
                <textarea id="terms_conditions" name="terms_conditions" rows="2"></textarea>
              </div>
            </td>
            <td></td>
            <td>
              <table width="100%">
                <tr>
                  <td><b>Subtotal</b></td>
                  <td style="text-align:right;"><span id="subtotalLabel">0.00</span></td>
                </tr>
                <tr>
                  <td><b>Line Discount</b></td>
                  <td style="text-align:right;"><span id="lineDiscountTotalLabel">0.00</span></td>
                </tr>
                <tr>
                  <td><b>Quote Discount</b></td>
                  <td style="text-align:right;">
                    <input type="number" id="quote_discount_amount" class="quotation-total-input" min="0" step="0.01" value="0">
                  </td>
                </tr>
                <tr>
                  <td><b>Total Discount</b></td>
                  <td style="text-align:right;"><span id="discountTotalLabel">0.00</span></td>
                </tr>
                <tr>
                  <td><b>Tax</b></td>
                  <td style="text-align:right;"><span id="taxTotalLabel">0.00</span></td>
                </tr>
                <tr>
                  <td><b>Grand Total</b></td>
                  <td style="text-align:right;"><span id="grandTotalLabel">0.00</span></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </div>

      <br>

      <div class="sectionDiv quotation-items-section">
        <table width="100%">
          <tr>
            <td class="mainTblHdr">Quotation Items:</td>
            <td style="text-align:right;">
              <input type="button" value="Add Row" onclick="addQuotationItem()" class="search">
            </td>
          </tr>
        </table>

        <div id="quotationItemsContainer" class="quotation-items-template">
          <script type="text/template" id="quotationItemsTmpl">
            <table style="width:100%;" class="dataTbl">
              <tr>
                <th width="4%">Line</th>
                <th width="17%">Material</th>
                <th width="8%">Part Code</th>
                <th width="8%">HSN/SAC</th>
                <th width="18%">Description</th>
                <th width="6%">Qty</th>
                <th width="7%">Unit</th>
                <th width="7%">Rate</th>
                <th width="6%">Disc %</th>
                <th width="6%">Tax %</th>
                <th width="9%">Line Total</th>
                <th width="4%" style="text-align:center;">Del</th>
              </tr>

              <% if(!items || items.length === 0){ %>
                <tr>
                  <td colspan="12" style="text-align:center;">No quotation items added.</td>
                </tr>
              <% } %>

              <%_.each(items, function(item, index){ %>
                <tr data-index="<%= index %>">
                  <td><%= index + 1 %></td>
                  <td>
                    <select class="quotation-line-select lineMaterial">
                      <option value="">Select</option>
                      <%_.each(materials, function(material){ %>
                        <option value="<%= material.material_id %>" <%= String(item.material_id || '') === String(material.material_id) ? 'selected' : '' %>><%= material.material_code ? material.material_code + ' - ' : '' %><%= material.material_name || '' %></option>
                      <% }); %>
                    </select>
                  </td>
                  <td><input type="text" class="quotation-line-input linePartCode" value="<%= item.part_code || '' %>" readonly></td>
                  <td><input type="text" class="quotation-line-input lineHsnSac" value="<%= item.hsn_sac_code || '' %>" readonly></td>
                  <td><input type="text" class="quotation-line-input lineDescription" value="<%= item.item_description || '' %>"></td>
                  <td><input type="number" class="quotation-line-input lineQty" min="0" step="0.01" value="<%= item.qty || 1 %>"></td>
                  <td>
                    <select class="quotation-line-select lineUnit">
                      <option value="">Select</option>
                      <%_.each(uoms, function(uom){ %>
                        <option value="<%= uom.uom_code || uom.uom_name || '' %>" <%= String(item.unit || '') === String(uom.uom_code || uom.uom_name || '') ? 'selected' : '' %>><%= uom.uom_code || uom.uom_name || '' %></option>
                      <% }); %>
                    </select>
                  </td>
                  <td><input type="number" class="quotation-line-input lineRate" min="0" step="0.01" value="<%= item.rate || 0 %>"></td>
                  <td><input type="number" class="quotation-line-input lineDiscount" min="0" step="0.01" value="<%= item.discount_percent || 0 %>"></td>
                  <td><input type="number" class="quotation-line-input lineTax" min="0" step="0.01" value="<%= item.tax_percent || 0 %>"></td>
                  <td style="text-align:right;"><span class="lineTotalLabel"><%= formatAmount(item.line_total || 0) %></span></td>
                  <td style="text-align:center;" onclick="deleteQuotationItem(<%= index %>)"><i class="material-icons" style="color: red;">delete_forever</i></td>
                </tr>
              <% }); %>
            </table>
          </script>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
