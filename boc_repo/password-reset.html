<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset - CoreFlow ERP</title>
  <link rel="shortcut icon" href="global/css/images/coreFlow/images.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="global/libs/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="global/properties.js" type="text/javascript"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(8, 20, 44, 0.998), rgba(14, 44, 101, 0.985) 48%, rgba(32, 114, 243, 0.955)),
        url("global/css/images/coreFlow/all images.png");
      background-size: cover;
      background-position: center;
      color: #07152f;
      font-family: "Inter", Arial, sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 480px;
      padding: 38px;
      border: 1px solid #d8e2f1;
      border-radius: 24px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      box-shadow: 0 28px 80px rgba(13, 27, 54, 0.18);
    }

    .reset-logo {
      display: block;
      width: 230px;
      height: 86px;
      object-fit: contain;
      margin: 0 auto 10px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      text-align: center;
    }

    .reset-copy {
      margin: 10px 0 24px;
      color: #63708a;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    label {
      display: block;
      margin: 0 0 8px;
      color: #24324d;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 46px;
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid #cdd8e8;
      border-radius: 10px;
      background: #f7faff;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    input:focus {
      border-color: #2072f3;
      box-shadow: 0 0 0 3px rgba(32, 114, 243, 0.14);
    }

    .reset-button,
    .login-link {
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #2072f3;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(32, 114, 243, 0.22);
    }

    .reset-message {
      display: none;
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .reset-message.success {
      display: block;
      background: #e9fff3;
      color: #167d43;
    }

    .reset-message.error {
      display: block;
      background: #fff1f2;
      color: #a0162f;
    }

    .login-link {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <img class="reset-logo" src="global/css/images/coreFlow/logo2.png" alt="CoreFlow ERP">
    <h1>Reset password</h1>
    <p class="reset-copy">Create a new password for your CoreFlow ERP account.</p>

    <div id="resetMessage" class="reset-message"></div>

    <form id="passwordResetForm">
      <label for="newPassword">Password</label>
      <input type="password" id="newPassword" name="newPassword" required>

      <label for="confirmPassword">Re-enter Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required>

      <button type="submit" class="reset-button">
        <i class="fa-solid fa-key"></i>
        Update Password
      </button>
    </form>

    <a class="login-link" id="loginLink" href="index.html">
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
      Go to Login
    </a>
  </main>

  <script>
    $("#passwordResetForm").on("submit", function (event) {
      event.preventDefault();

      var token = new URLSearchParams(window.location.search).get("token") || "";
      var password = $("#newPassword").val() || "";
      var confirmPassword = $("#confirmPassword").val() || "";

      if (!token) {
        showResetMessage("error", "This password reset link is missing its token.");
        return;
      }

      if (password !== confirmPassword) {
        showResetMessage("error", "Passwords do not match.");
        return;
      }

      $.ajax({
        type: "POST",
        url: request_url + "/user/password-reset/confirm",
        data: JSON.stringify({
          token: token,
          password: password,
          confirm_password: confirmPassword
        }),
        contentType: "application/json",
        success: function () {
          $("#passwordResetForm").hide();
          $("#loginLink").css("display", "inline-flex");
          showResetMessage("success", "Your password has been reset. You can now sign in.");
        },
        error: function (xhr) {
          var message = "Unable to reset password.";

          if (xhr && xhr.responseJSON && xhr.responseJSON.error) {
            message = xhr.responseJSON.error;
          }

          showResetMessage("error", message);
        }
      });
    });

    function showResetMessage(type, message) {
      $("#resetMessage")
        .removeClass("success error")
        .addClass(type)
        .text(message);
    }
  </script>
</body>

</html>
